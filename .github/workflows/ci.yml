name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm --filter @campusos/core rebuild:electron
      - run: pnpm --filter @campusos/core test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: packages/core/test-results
          if-no-files-found: ignore

  release-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version."
          }
      - run: pnpm dist
      - name: Generate installer checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath dist -Filter 'CampusOS-*-win-x64.exe')
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)." }
          $installer = $installers[0]
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: CampusOS-${{ github.ref_name }}-windows
          path: |
            dist/CampusOS-*-win-x64.exe
            dist/CampusOS-*-win-x64.exe.blockmap
            dist/CampusOS-*-win-x64.exe.sha256
            dist/latest.yml
          if-no-files-found: error
      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath dist -Filter 'CampusOS-*-win-x64.exe')
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)." }
          $installer = $installers[0]
          $assets = @(
            $installer.FullName,
            "$($installer.FullName).blockmap",
            "$($installer.FullName).sha256",
            (Resolve-Path -LiteralPath dist/latest.yml).Path
          )
          gh release create $env:GITHUB_REF_NAME --verify-tag --prerelease --generate-notes `
            --title "CampusOS $($env:GITHUB_REF_NAME.TrimStart('v'))（Windows x64 内测预发布）" $assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
